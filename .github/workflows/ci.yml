name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      # Actions must be pinned to a commit, and only allowed ones may run
      # (the repository's Actions settings). setup-python is not allowed;
      # setup-uv installs the Python and activates a virtual environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install Red-DiscordBot
        run: |
          # Red imports pip, which a uv environment does not include.
          uv pip install pip "Red-DiscordBot"

      - name: Install mqttbridge requirements
        run: uv pip install "paho-mqtt>=2.0" meshtastic cryptography aiohttp

      - name: Syntax check (compile all cogs)
        run: python -m compileall -q mqttbridge strikes sonoran

      - name: Lint with flake8
        run: |
          uv pip install flake8
          # E9   — syntax / indentation errors (always fatal)
          # F821 — undefined name (would crash at runtime)
          # F811 — redefinition of an unused import / name
          flake8 mqttbridge strikes sonoran tests --count --select=E9,F821,F811 --show-source --statistics

      - name: Verify cog imports
        run: |
          python -c "import mqttbridge; print('mqttbridge: OK')"
          python -c "import strikes;    print('strikes:    OK')"
          python -c "import sonoran;    print('sonoran:    OK')"

      - name: Run tests
        run: |
          uv pip install pytest pytest-asyncio
          pytest
